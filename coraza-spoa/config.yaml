# Coraza-SPOA configuration for WHP haproxy-manager integration.
#
# One named application "haproxy" — the haproxy-manager spoe template
# references this same name in its spoe-agent block, so the SPOA knows
# which rules to apply when HAProxy dispatches a request.
#
# Mode: SecRuleEngine DetectionOnly globally; overrides.conf promotes
# specific high-confidence rule ID ranges to enforcement individually.
# This is the safest posture for v1 — every rule logs, but only the
# unambiguous ones (scanner UAs, RCE, LFI, webshells, Log4Shell) block.

bind: 0.0.0.0:9000

# Process-level logging (separate from per-request audit logging below)
log_level: info
log_file: /dev/stdout
log_format: json

# Fallback when the request doesn't match a named application — we only
# have one, so it's also the default.
default_application: haproxy

applications:
  - name: haproxy
    directives: |
      # CRS-bundled defaults: recommended Coraza settings + CRS setup +
      # the rule pack itself (~16 MB of rules embedded in the binary).
      Include @coraza.conf-recommended

      # Request-body limits, set explicitly instead of inheriting the
      # recommended file's 12.5 MB / Reject. HAProxy only ever hands us one
      # buffer of body (tune.bufsize 16384 in haproxy-manager's
      # hap_header.tpl), and the SPOP library refuses frames over 65535
      # bytes, so no body we receive can exceed 64 KB. The invariant is:
      #     tune.bufsize (16 KB) < SPOP frame cap (65535) < SecRequestBodyLimit
      # Breaking it is NOT harmless: SecRequestBodyLimitAction Reject
      # interrupts with 413 even under DetectionOnly (Coraza
      # setAndReturnBodyLimitInterruption ignores the engine mode), which the
      # edge turns into a 403 on every large upload. ProcessPartial is the
      # belt to that brace. InMemoryLimit == BodyLimit keeps the body buffer
      # off disk (this image is distroless). Pinned by
      # haproxy-manager-base/scripts/test-waf-body-inspection.py.
      SecRequestBodyLimit 131072
      SecRequestBodyInMemoryLimit 131072
      SecRequestBodyLimitAction ProcessPartial

      # JSON nesting limit (the recommended file sets 1024). Coraza's JSON
      # flattener is quadratic in nesting: a 601-byte `[[[...]]]` of depth 300
      # cost 297 ms and depth 1000 (2 KB) 3.1 s of CPU -- past the 100 ms SPOE
      # timeout, so the request passed UNINSPECTED (fail-open) while the WAF
      # burned CPU. Over the limit the body fails to parse (REQBODY_ERROR,
      # 0.1 ms), which WHP's enforce-mode body-integrity rule denies on a
      # complete body. Legitimate depth, measured on the JSON shipped in
      # WordPress 6.x core, Gutenberg, WooCommerce and Elementor (theme.json,
      # styles/*.json, block.json, checkout schemas): max 8, so a global-styles
      # save is ~9; 64 leaves ~7x headroom for Divi/Elementor-style module
      # trees that could not be sampled. Depth 64 itself costs ~21 ms.
      SecRequestBodyJsonDepthLimit 64

      # Argument-count limit, per source (ARGS_GET, ARGS_POST, ARGS_PATH).
      # Coraza 3.8 started ENFORCING SecArgumentsLimit (default 1000) on
      # urlencoded and JSON bodies and on the query string: parsing stops at
      # the limit, ARGUMENTS_LIMIT_REACHED is set, and every argument after it
      # is never inspected (GHSA-3ww9-vw83-9w5x). Coraza <= 3.7 inspected every
      # urlencoded/JSON argument. With the default, "1000 filler args + an
      # LFI in arg 1001" bypassed 930120 (an enforced rule) on 3.8.1 in WHP's
      # regression net. Upstream pairs the cap with deny rules 200004/200005,
      # but those live in Coraza's own coraza.conf-recommended; the
      # @coraza.conf-recommended Included above is the one embedded in
      # coraza-coreruleset v4.25.0, which predates them.
      # 65536 = SecRequestBodyLimit / 2: a urlencoded pair is at least two
      # bytes ("a&"), so no body we accept can reach the limit, and the query
      # string is bounded by tune.bufsize (16 KB) far below it. Every argument
      # is therefore inspected, exactly as on 3.7. Memory stays bounded by
      # the body limit (the reason upstream added the cap). WHP's JSON
      # argument-count guard (991900030/031, ">= 1000" in pre-overrides.conf)
      # is unaffected: it counts what this limit lets through.
      SecArgumentsLimit 65536

      # Defense in depth for the limit above (unreachable while it is
      # >= SecRequestBodyLimit / 2): if arguments were ever dropped, Coraza
      # did not see the whole request. Same two-rule shape as WHP's JSON
      # guard: 209620 switches the engine on in enforce mode
      # (tx.whp_enforce_mode, set in phase 1 by WHP's local-overrides.conf),
      # 209621 denies; in detect_only it only logs (audit-logged). Phase 2
      # and placed before pre-overrides/CRS so it runs before every CRS
      # phase-2 rule. ARGUMENTS_LIMIT_REACHED exists only on Coraza >= 3.8,
      # which is why this lives in the image, not in WHP's rendered files.
      SecRule TX:whp_enforce_mode "@eq 1" \
          "id:209620,phase:2,pass,nolog,t:none,chain"
      SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
          "t:none,ctl:ruleEngine=On"
      SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
          "id:209621,phase:2,deny,status:400,log,t:none,msg:'Argument limit reached: arguments were dropped uninspected',tag:'whp/coraza-arguments-limit',ctl:auditEngine=On"

      Include @crs-setup.conf.example

      # Runtime-managed PRE-CRS exclusions written by WHP UI. Empty by default.
      # Loaded BEFORE the CRS rules so per-host ctl:ruleRemoveById exemptions
      # fire in phase:1 BEFORE the CRS rule they're trying to exempt would
      # otherwise match. Server-wide overrides live in local-overrides.conf
      # (loaded after CRS) instead.
      Include /etc/coraza/pre-overrides.conf

      Include @owasp_crs/*.conf

      # WHP-specific overrides — day-one enforce list, plus tuning for
      # the customer mix (WordPress, WooCommerce, Divi). Read this file
      # to see exactly what blocks vs what's detect-only.
      Include /etc/coraza/overrides.conf

      # Runtime-managed POST-CRS overrides written by WHP UI. Empty by default.
      Include /etc/coraza/local-overrides.conf

      # Global mode: log all alerts, block only what overrides.conf
      # explicitly promotes via ctl:ruleEngine=On.
      SecRuleEngine DetectionOnly

      # Audit log: JSON to a bind-mounted file so AI Monitor + log
      # rotation can pick it up. RelevantOnly means we don't log every
      # passing request, only ones that triggered at least one rule.
      SecAuditEngine RelevantOnly
      SecAuditLog /var/log/coraza/audit.log
      SecAuditLogFormat JSON
      SecAuditLogParts ABIJDEFHKZ

    # HAProxy sends request-only events for v1. Response inspection adds
    # latency on every page render with marginal additional protection
    # for our customer mix; can be turned on later if we want it.
    response_check: false

    # Transactions cache for 60s. SPOE protocol is fire-and-forget per
    # request, so this is just how long Coraza holds context for any
    # multi-stage processing.
    transaction_ttl_ms: 60000

    log_level: info
    log_file: /var/log/coraza/spoa.log
    log_format: json
