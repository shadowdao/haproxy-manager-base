name: Build and push coraza-spoa
run-name: ${{ gitea.actor }} pushed a change to coraza-spoa/

# Triggers only on changes to the coraza-spoa subdirectory or this workflow
# file itself — keeps the main haproxy-manager-base build and the coraza-spoa
# build independent. workflow_dispatch lets us trigger manually after bumping
# the upstream coraza-spoa version pin.
on:
  push:
    branches:
      - main
    paths:
      - 'coraza-spoa/**'
      - '.gitea/workflows/build-push-coraza.yaml'
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Internal package cache (CT130 pkg-cache; canonical docs: docs/pkg-cache.md
      # in cloud-apache-container). Used ONLY if it answers over TLS with our
      # pinned CA; otherwise (down, unreachable, bad/expired cert) this job builds
      # from the upstream repositories / default GOPROXY exactly as before. The
      # build stages' base (golang:1.25) comes from the in-house registry
      # (repo.anhonesthost.net, weekly digest-pinned mirror of Docker Hub -
      # mirror-base-image.yaml) and the runtime base from gcr.io, not docker.io,
      # so the pkg-cache registry mirror is never used here: repos + Go modules.
      # The CA lives under coraza-spoa/ because that is this build's context.
      - name: Probe package cache
        id: pkgcache
        run: |
          url=""
          if curl -fsS --max-time 5 --cacert coraza-spoa/keys/pkg-cache/ca.crt -o /dev/null https://192.168.1.40/; then url="https://192.168.1.40"; fi
          echo "pkg-cache: repos=${url:-<unreachable: upstream>} registry-mirror=<not used: no docker.io base (base from repo.anhonesthost.net)>"
          [ -n "$url" ] || echo "::warning::pkg-cache unreachable - building from upstream repositories"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Login to Gitea
        uses: docker/login-action@v3
        with:
          registry: repo.anhonesthost.net
          username: ${{ secrets.CI_USER }}
          password: ${{ secrets.CI_TOKEN }}

      # Mirror to GitHub Container Registry — see build-push.yaml for the
      # secret/username convention.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shadowdao
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: ./coraza-spoa
          platforms: linux/amd64
          push: true
          build-args: |
            PKG_CACHE=${{ steps.pkgcache.outputs.url }}
          tags: |
            repo.anhonesthost.net/cloud-hosting-platform/coraza-spoa:latest
            ghcr.io/shadowdao/coraza-spoa:latest
